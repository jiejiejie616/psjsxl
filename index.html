<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑步配速双向计算器+VDOT+训练分区</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{padding:20px;background:#f4f7fa}
.box{background:#fff;border-radius:14px;padding:20px;max-width:460px;margin:0 auto;box-shadow:0 2px 10px #00000015}
h2{text-align:center;color:#222;margin-bottom:20px;font-size:20px}
.mode-tab{display:flex;gap:6px;margin-bottom:18px}
.mode-tab button{flex:1;padding:10px;border:1px solid #2563eb;background:#fff;color:#2563eb;border-radius:8px;font-size:15px;cursor:pointer}
.mode-tab button.active{background:#2563eb;color:#fff}
.item{margin-bottom:14px}
label{display:block;margin-bottom:6px;color:#444;font-size:15px}
select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.time-row{display:flex;gap:8px}
.time-row input{flex:1}
.btn-group{display:flex;gap:10px;margin-top:18px}
button#calc{flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;background:#2563eb;color:#fff}
button#clear{flex:1;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;background:#eee;color:#333}
.result{margin-top:20px;padding:16px;background:#f0f7ff;border-radius:10px;font-size:16px;line-height:1.7}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
<h2>双向配速计算器+VDOT+分区</h2>
<div class="mode-tab">
<button class="active" data-mode="time2pace">时长→配速</button>
<button data-mode="pace2time">配速→时长</button>
</div>

<div class="item">
<label>距离选择</label>
<select id="distSelect">
<option value="3">3km</option>
<option value="5">5km</option>
<option value="10">10km</option>
<option value="21.0975">半马 21.0975km</option>
<option value="42.195">全马 42.195km</option>
<option value="custom">自定义</option>
</select>
</div>
<div class="item" id="customDistWrap">
<label>自定义距离(km)</label>
<input type="number" id="customDist" placeholder="例如：25" step="0.01">
</div>

<div id="time2pacePanel">
<div class="item">
<label>总用时</label>
<div class="time-row">
<input type="number" id="hInput" placeholder="时" min="0">
<input type="number" id="mInput" placeholder="分" min="0">
<input type="number" id="sInput" placeholder="秒" min="0">
</div>
</div>
</div>

<div id="pace2timePanel" class="hide">
<div class="item">
<label>配速</label>
<div class="time-row">
<input type="number" id="paceMin" placeholder="分" min="0">
<input type="number" id="paceSec" placeholder="秒" min="0">
</div>
</div>
</div>

<div class="btn-group">
<button id="calc">计算</button>
<button id="clear">清空</button>
</div>
<div class="result" id="res"></div>
</div>

<script>
const tabBtns = document.querySelectorAll('.mode-tab button');
const time2pacePanel = document.getElementById('time2pacePanel');
const pace2timePanel = document.getElementById('pace2timePanel');
const distSelect = document.getElementById('distSelect');
const customDistWrap = document.getElementById('customDistWrap');
const customDistInput = document.getElementById('customDist');
const hInput = document.getElementById('hInput');
const mInput = document.getElementById('mInput');
const sInput = document.getElementById('sInput');
const paceMin = document.getElementById('paceMin');
const paceSec = document.getElementById('paceSec');
const calcBtn = document.getElementById('calc');
const clearBtn = document.getElementById('clear');
const resDom = document.getElementById('res');

let currentMode = "time2pace";

tabBtns.forEach(btn=>{
    btn.onclick = ()=>{
        tabBtns.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if(currentMode === 'time2pace'){
            time2pacePanel.classList.remove('hide');
            pace2timePanel.classList.add('hide');
        }else{
            time2pacePanel.classList.add('hide');
            pace2timePanel.classList.remove('hide');
        }
        resDom.innerText = "";
    }
})

distSelect.onchange = ()=>{
    if(distSelect.value === 'custom'){
        customDistWrap.classList.remove('hide');
    }else{
        customDistWrap.classList.add('hide');
    }
}

function getDist(){
    if(distSelect.value === 'custom'){
        return parseFloat(customDistInput.value);
    }else{
        return parseFloat(distSelect.value);
    }
}

// 秒 → 时:分:秒字符串
function sec2hms(totalSec){
    const h = Math.floor(totalSec / 3600);
    const rem = totalSec % 3600;
    const m = Math.floor(rem / 60);
    const s = Math.round(rem % 60);
    return `${h}时${m}分${s}秒`;
}
// 秒 → 分′秒″配速格式
function sec2ms(sec){
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return `${m}′${s}″/km`;
}

// 丹尼尔斯VDOT公式
function calcVDOT(distKm, totalSec){
    const distM = distKm * 1000;
    const timeMin = totalSec / 60;
    const v = distM / timeMin;
    let vdot = -4.6 + 0.182258 * v + 0.000104 * v * v;
    vdot = Math.max(0, Math.round(vdot * 10)/10);
    return vdot;
}

// 丹尼尔斯各区配速系数 + 用途备注
function getZonePace(vdot){
    const eLow = 1.24;
    const eHigh = 1.34;
    const mFac = 1.06;
    const tLow = 0.93;
    const tHigh = 0.97;
    const iLow = 0.81;
    const iHigh = 0.85;
    const rFac = 0.72;

    const sqrtV = Math.sqrt(0.182258*0.182258 + 4*0.000104*(vdot+4.6));
    const v = (-0.182258 + sqrtV)/(2*0.000104);
    const fiveKmSec = (5000 / v)*60;
    const baseSecPerKm = fiveKmSec /5;
    return {
        E: [baseSecPerKm*eLow, baseSecPerKm*eHigh, "轻松跑，日常有氧、恢复跑、长距离LSD"],
        M: [baseSecPerKm*mFac, "马拉松配速，专项长距离里的MP分段"],
        T: [baseSecPerKm*tLow, baseSecPerKm*tHigh, "阈值跑，乳酸阈值课，T配速持续跑"],
        I: [baseSecPerKm*iLow, baseSecPerKm*iHigh, "间歇跑，VO2max间歇，400/800/2000间歇"],
        R: [baseSecPerKm*rFac, "冲刺跑，短距离重复冲刺，R配速150m、200m"]
    }
}

calcBtn.onclick = ()=>{
    const dist = getDist();
    if(!dist || dist <=0){
        resDom.innerText = "请填写有效距离！";
        return;
    }
    let totalSec, secPerKm, vdot, zones;
    if(currentMode === 'time2pace'){
        const h = Number(hInput.value||0);
        const m = Number(mInput.value||0);
        const s = Number(sInput.value||0);
        totalSec = h*3600 + m*60 + s;
        if(totalSec <= 0){
            resDom.innerText = "请输入有效时间！";
            return;
        }
        secPerKm = totalSec / dist;
    }else{
        const pMin = Number(paceMin.value||0);
        const pSec = Number(paceSec.value||0);
        secPerKm = pMin*60 + pSec;
        if(secPerKm <= 0){
            resDom.innerText = "请输入有效配速！";
            return;
        }
        // 【修复：配速→总时长】
        totalSec = secPerKm * dist;
    }
    vdot = calcVDOT(dist, totalSec);
    zones = getZonePace(vdot);
    const speed = (dist / (totalSec/3600)).toFixed(2);
    let html = `✅ 距离：${dist.toFixed(2)} km<br>`;
    html += `✅ 平均配速：<strong>${sec2ms(secPerKm)}</strong><br>`;
    html += `✅ 预计总时长：<strong>${sec2hms(totalSec)}</strong><br>`;
    html += `✅ 平均时速：${speed} km/h<br>`;
    html += `✅ VDOT估值：<strong>${vdot}</strong><br><br>`;
    html += `📌 丹尼尔斯训练分区配速：<br>`;
    html += `E（二区轻松）：${sec2ms(zones.E[0])} ~ ${sec2ms(zones.E[1])} 【${zones.E[2]}】<br>`;
    html += `M（马拉松配速）：${sec2ms(zones.M[0])} 【${zones.M[1]}】<br>`;
    html += `T（三区阈值）：${sec2ms(zones.T[0])} ~ ${sec2ms(zones.T[1])} 【${zones.T[2]}】<br>`;
    html += `I（四区间歇）：${sec2ms(zones.I[0])} ~ ${sec2ms(zones.I[1])} 【${zones.I[2]}】<br>`;
    html += `R（五区冲刺）：${sec2ms(zones.R[0])} 【${zones.R[1]}】`;
    resDom.innerHTML = html;
}

clearBtn.onclick = ()=>{
    hInput.value = '';
    mInput.value = '';
    sInput.value = '';
    paceMin.value = '';
    paceSec.value = '';
    customDistInput.value = '';
    distSelect.value = "3";
    customDistWrap.classList.add('hide');
    resDom.innerText = '';
}
</script>
</body>
</html>
